<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asmit Saurabh</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #ffffff;
            --secondary: #cccccc;
            --accent: #FF0076;
            --dark: #000000;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            line-height: 1.8;
            margin: 0;
            padding: 0;
            background: var(--dark);
            color: #ffffff;
            overflow: hidden;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .streak {
            position: absolute;
            width: 2px;
            height: 80px;
            background: rgba(255, 255, 255, 0.8);
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            from {
                transform: translateY(-100px);
                opacity: 1;
            }
            to {
                transform: translateY(100vh);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="container">
        <header class="header">
            <h1>Asmit Saurabh</h1>
            <p>Web Scraper & Python Programmer</p>
            <p>📧 <a href="mailto:saurabhasmit8@gmail.com?subject=Hello%20There">Send Email</a> </p>
            <p>
                <a href="cv.pdf" download class="download-cv">
                    <i class="fas fa-download"></i> My CV
                </a>
            </p>
        </header>
    </div>

    <script>
        function createStreak() {
            const streak = document.createElement("div");
            streak.classList.add("streak");
            document.querySelector(".background").appendChild(streak);
            streak.style.left = Math.random() * 100 + "vw";
            streak.style.animationDuration = Math.random() * 2 + 2 + "s";
            setTimeout(() => streak.remove(), 4000);
        }

        setInterval(createStreak, 100);
    </script>
</body>
</html>
